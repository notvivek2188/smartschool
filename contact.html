<!DOCTYPE html>
<html lang="en">

<head>
    <title>Contact | Smart School 2040</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="contact.css">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
</head>

<body>

    <div class="background"></div>

    <nav>
        <div class="nav-container">
            <div class="logo-section">
                <p id="logotext">Smart School 2040</p>
            </div>

            <div class="nav-buttons">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="facilities.html">Features</a>
            </div>
        </div>
    </nav>

  <main>

    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

    <div class="contact-box">

        <div class="left">
            <lottie-player 
                src="https://assets9.lottiefiles.com/packages/lf20_px0ntw70.json"
                background="transparent"
                speed="1"
                loop
                autoplay>
            </lottie-player>
        </div>

        <div class="right">
            <h2>Connect With The Future</h2>
            <p class="subtitle">Admissions • Collaborations • Innovation Queries</p>

            <form>
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <textarea placeholder="Your Message"></textarea>

                <button type="submit">Send Message</button>
            </form>
        </div>

    </div>

</main>

    <section class="cta">
        <div class="cta-box">
            <p>Step into the future of learning with Smart School 2040.</p>
        </div>

        <a href="#" class="cta-btn">Contact Admissions</a>
    </section>

</body>

</html>
